spring.application.name=articrawler

# H2 file-mode database (single-file, no separate DB server)
spring.datasource.url=jdbc:h2:file:./data/articrawler;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# News collection
articrawler.collection.interval-ms=900000
articrawler.collection.initial-delay-ms=10000
articrawler.collection.overlap-minutes=60
articrawler.collection.request-timeout-ms=6000
articrawler.collection.enrich-images=true

# CORS (React dev server)
articrawler.cors.allowed-origins=http://localhost:5173,http://localhost:3000
